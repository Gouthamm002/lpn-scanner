<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      max-width: 500px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    #message {
      margin: 15px;
      color: #555;
    }

    #sender {
      display: none;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Scanner</h2>

  <div id="reader"></div>

  <div id="result">
    Scan an LPN QR code
  </div>

  <div id="message">
    Camera will start when the page loads.
  </div>

  <!-- Hidden frame used to send LPN to Apps Script -->
  <iframe id="sender" name="sender"></iframe>

  <script>

    const scriptURL =
  "https://script.google.com/macros/s/AKfycbyQymQIwRzS01s264FD5AKOQOVmAAwWSb-ER9nhiJUi0YtVzMfAmwGBnYTPjKtw_LH8XQ/exec";
    
    let lastScanned = "";

    function onScanSuccess(decodedText) {

      // Prevent the same QR from being saved repeatedly
      if (decodedText === lastScanned) {
        return;
      }

      lastScanned = decodedText;

      // Display LPN
      document.getElementById("result").innerText = decodedText;

      document.getElementById("message").innerText =
        "LPN detected! Saving...";

      // Create a hidden form
      const form = document.createElement("form");

      form.method = "GET";
      form.action = scriptURL;
      form.target = "sender";

      // Add LPN parameter
      const input = document.createElement("input");

      input.type = "hidden";
      input.name = "lpn";
      input.value = decodedText;

      form.appendChild(input);

      document.body.appendChild(form);

      // Send request
      form.submit();

      // Remove temporary form
      setTimeout(function() {
        form.remove();
      }, 1000);

      // We can't read the cross-site response,
      // but the request has been sent.
      setTimeout(function() {

        document.getElementById("message").innerText =
          "✅ LPN sent to Google Sheet!";

      }, 1500);

      console.log("LPN sent:", decodedText);
    }


    function onScanFailure(error) {
      // Keep scanning
    }


    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);

  </script>

</body>
</html>
