<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Audit</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #lpn {
      background: #eeeeee;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
      margin-top: 5px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .cancelButton {
      background: #777;
    }

    .auditAgainButton {
      background: #b45309;
    }

    #message {
      margin: 15px auto;
      max-width: 500px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .info {
      color: #555;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 15px;
      border-radius: 10px;
      margin: 15px auto;
      max-width: 500px;
      text-align: left;
    }

    .warning h3 {
      margin-top: 0;
      text-align: center;
    }

    .previousData {
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Audit</h2>

  <div id="reader"></div>

  <div id="duplicateBox" class="warning hidden">

    <h3>⚠️ DUPLICATE LPN</h3>

    <div>
      This LPN has already been audited.
    </div>

    <div class="previousData">

      <strong>Previous Audit</strong><br><br>

      System Qty:
      <span id="previousSystem">-</span>
      <br>

      Physical Qty:
      <span id="previousPhysical">-</span>
      <br>

      Difference:
      <span id="previousDifference">-</span>
      <br>

      Status:
      <strong id="previousStatus">-</strong>

    </div>

    <button
      class="auditAgainButton"
      type="button"
      onclick="auditAgain()"
    >
      AUDIT AGAIN
    </button>

    <button
      class="cancelButton"
      type="button"
      onclick="cancelDuplicate()"
    >
      CANCEL
    </button>

  </div>


  <div id="auditBox" class="box">

    <label for="lpn">LPN</label>

    <input
      type="text"
      id="lpn"
      placeholder="Scan QR code"
      readonly
    >

    <label for="systemQty">System Quantity</label>

    <input
      type="number"
      id="systemQty"
      placeholder="Enter system quantity"
      min="0"
      step="1"
      inputmode="numeric"
    >

    <label for="physicalQty">Physical Quantity</label>

    <input
      type="number"
      id="physicalQty"
      placeholder="Enter physical quantity"
      min="0"
      step="1"
      inputmode="numeric"
    >

    <button
      id="saveButton"
      type="button"
      onclick="saveData()"
      disabled
    >
      SAVE
    </button>

  </div>


  <div id="message" class="info">
    Scan an LPN QR code to begin.
  </div>


  <script>

    // ==================================================
    // APPS SCRIPT URL
    // ==================================================

    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyQymQIwRzS01s264FD5AKOQOVmAAwWSb-ER9nhiJUi0YtVzMfAmwGBnYTPjKtw_LH8XQ/exec";


    // ==================================================
    // GLOBAL VARIABLES
    // ==================================================

    let scanner = null;

    let scannedLPN = "";

    let scanLocked = false;

    let jsonpScript = null;


    // ==================================================
    // MESSAGE
    // ==================================================

    function setMessage(text, type) {

      const message =
        document.getElementById("message");

      message.innerText = text;

      message.className =
        type || "info";
    }


    // ==================================================
    // START SCANNER
    // ==================================================

    function startScanner() {

      scanLocked = false;

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );

      scanner.render(
        onScanSuccess,
        onScanFailure
      );
    }


    // ==================================================
    // QR SUCCESS
    // ==================================================

    function onScanSuccess(decodedText) {

      if (scanLocked) {
        return;
      }

      scanLocked = true;

      scannedLPN = decodedText;

      document.getElementById("lpn").value =
        decodedText;

      setMessage(
        "Checking LPN...",
        "info"
      );


      // Stop scanner
      if (scanner) {

        scanner.clear()
          .catch(function(error) {
            console.log(error);
          });

      }


      // Check duplicate
      checkDuplicate(decodedText);
    }


    function onScanFailure(error) {
      // Ignore normal scanning failures
    }


    // ==================================================
    // CHECK DUPLICATE
    // ==================================================

    function checkDuplicate(lpn) {

      const callbackName =
        "duplicateCheck_" +
        Date.now();


      window[callbackName] =
        function(response) {

          cleanupJSONP();


          if (
            response &&
            response.success === true
          ) {

            if (response.duplicate) {

              // Show previous audit
              document.getElementById(
                "previousSystem"
              ).innerText =
                response.previous.systemQty;

              document.getElementById(
                "previousPhysical"
              ).innerText =
                response.previous.physicalQty;

              document.getElementById(
                "previousDifference"
              ).innerText =
                response.previous.difference;

              document.getElementById(
                "previousStatus"
              ).innerText =
                response.previous.status;


              // Show duplicate warning
              document.getElementById(
                "duplicateBox"
              ).classList.remove("hidden");


              document.getElementById(
                "auditBox"
              ).classList.add("hidden");


              setMessage(
                "Duplicate LPN detected.",
                "error"
              );

            } else {

              // New LPN
              showNewLPN();

            }

          } else {

            setMessage(
              "Could not check LPN. Please try again.",
              "error"
            );

            resetForNextScan();
          }
        };


      const requestURL =
        scriptURL +
        "?action=check" +
        "&lpn=" +
        encodeURIComponent(lpn) +
        "&callback=" +
        encodeURIComponent(callbackName);


      jsonpScript =
        document.createElement("script");

      jsonpScript.src = requestURL;

      jsonpScript.async = true;


      jsonpScript.onerror =
        function() {

          cleanupJSONP();

          setMessage(
            "❌ Could not connect to Google Sheet.",
            "error"
          );

          resetForNextScan();
        };


      document.body.appendChild(
        jsonpScript
      );
    }


    // ==================================================
    // NEW LPN
    // ==================================================

    function showNewLPN() {

      document.getElementById(
        "duplicateBox"
      ).classList.add("hidden");

      document.getElementById(
        "auditBox"
      ).classList.remove("hidden");

      document.getElementById(
        "saveButton"
      ).disabled = false;

      setMessage(
        "✅ New LPN. Enter quantities.",
        "success"
      );


      setTimeout(function() {

        document
          .getElementById("systemQty")
          .focus();

      }, 300);
    }


    // ==================================================
    // AUDIT AGAIN
    // ==================================================

    function auditAgain() {

      document.getElementById(
        "duplicateBox"
      ).classList.add("hidden");

      document.getElementById(
        "auditBox"
      ).classList.remove("hidden");

      document.getElementById(
        "saveButton"
      ).disabled = false;

      setMessage(
        "Audit again. Enter new quantities.",
        "info"
      );


      document
        .getElementById("systemQty")
        .focus();
    }


    // ==================================================
    // CANCEL DUPLICATE
    // ==================================================

    function cancelDuplicate() {

      document.getElementById(
        "duplicateBox"
      ).classList.add("hidden");

      document.getElementById(
        "auditBox"
      ).classList.remove("hidden");

      resetForNextScan();

      setMessage(
        "Scan the next LPN.",
        "info"
      );
    }


    // ==================================================
    // SAVE
    // ==================================================

    function saveData() {

      const lpn =
        document
          .getElementById("lpn")
          .value
          .trim();

      const systemQty =
        document
          .getElementById("systemQty")
          .value
          .trim();

      const physicalQty =
        document
          .getElementById("physicalQty")
          .value
          .trim();


      if (!lpn) {

        setMessage(
          "Please scan an LPN.",
          "error"
        );

        return;
      }


      if (systemQty === "") {

        setMessage(
          "Please enter System Quantity.",
          "error"
        );

        return;
      }


      if (physicalQty === "") {

        setMessage(
          "Please enter Physical Quantity.",
          "error"
        );

        return;
      }


      const saveButton =
        document.getElementById(
          "saveButton"
        );

      saveButton.disabled = true;


      setMessage(
        "Saving...",
        "info"
      );


      const callbackName =
        "saveCallback_" +
        Date.now();


      window[callbackName] =
        function(response) {

          cleanupJSONP();


          if (
            response &&
            response.success === true
          ) {

            setMessage(
              "✅ Saved! Ready for next LPN.",
              "success"
            );


            resetFields();


            setTimeout(function() {

              startScanner();

            }, 300);

          } else {

            setMessage(
              "❌ Save failed. Please try again.",
              "error"
            );

            saveButton.disabled = false;
          }
        };


      const requestURL =
        scriptURL +
        "?action=save" +
        "&lpn=" +
        encodeURIComponent(lpn) +
        "&systemQty=" +
        encodeURIComponent(systemQty) +
        "&physicalQty=" +
        encodeURIComponent(physicalQty) +
        "&callback=" +
        encodeURIComponent(callbackName);


      jsonpScript =
        document.createElement("script");

      jsonpScript.src = requestURL;

      jsonpScript.async = true;


      jsonpScript.onerror =
        function() {

          cleanupJSONP();

          setMessage(
            "❌ Could not connect to Google Sheet.",
            "error"
          );

          saveButton.disabled = false;
        };


      document.body.appendChild(
        jsonpScript
      );
    }


    // ==================================================
    // RESET FIELDS
    // ==================================================

    function resetFields() {

      document.getElementById(
        "lpn"
      ).value = "";

      document.getElementById(
        "systemQty"
      ).value = "";

      document.getElementById(
        "physicalQty"
      ).value = "";

      document.getElementById(
        "saveButton"
      ).disabled = true;

      scannedLPN = "";

      scanLocked = false;
    }


    // ==================================================
    // RESET FOR NEXT SCAN
    // ==================================================

    function resetForNextScan() {

      resetFields();

      document.getElementById(
        "duplicateBox"
      ).classList.add("hidden");

      document.getElementById(
        "auditBox"
      ).classList.remove("hidden");

      document.getElementById(
        "reader"
      ).innerHTML = "";

      setTimeout(function() {

        startScanner();

      }, 300);
    }


    // ==================================================
    // CLEAN JSONP
    // ==================================================

    function cleanupJSONP() {

      if (jsonpScript) {

        jsonpScript.remove();

        jsonpScript = null;
      }
    }


    // ==================================================
    // START APP
    // ==================================================

    startScanner();

  </script>

</body>
</html>
