<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Audit</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .box {
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #lpn {
      background: #eeeeee;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }

    #message {
      margin: 15px auto;
      max-width: 500px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Audit</h2>

  <div id="reader"></div>

  <div class="box">

    <label>LPN</label>

    <input
      type="text"
      id="lpn"
      placeholder="Scan QR code"
      readonly
    >

    <label>System Quantity</label>

    <input
      type="number"
      id="systemQty"
      placeholder="Enter system quantity"
      min="0"
      inputmode="numeric"
    >

    <label>Physical Quantity</label>

    <input
      type="number"
      id="physicalQty"
      placeholder="Enter physical quantity"
      min="0"
      inputmode="numeric"
    >

    <button
      id="saveButton"
      onclick="saveData()"
      disabled
    >
      SAVE
    </button>

  </div>

  <div id="message">
    Scan an LPN QR code to begin.
  </div>


  <script>

    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyQymQIwRzS01s264FD5AKOQOVmAAwWSb-ER9nhiJUi0YtVzMfAmwGBnYTPjKtw_LH8XQ/exec";

    let scannedLPN = "";
    let scanner = null;
    let scanLocked = false;


    // ================================
    // START SCANNER
    // ================================

    function startScanner() {

      scanLocked = false;

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );

      scanner.render(
        onScanSuccess,
        onScanFailure
      );
    }


    // ================================
    // QR SCANNED
    // ================================

    function onScanSuccess(decodedText) {

      if (scanLocked) {
        return;
      }

      scanLocked = true;

      scannedLPN = decodedText;

      document.getElementById("lpn").value =
        decodedText;

      document.getElementById("message").innerText =
        "LPN captured. Enter quantities.";

      document.getElementById("message").className = "";

      document.getElementById("saveButton").disabled =
        false;


      if (scanner) {

        scanner.clear().catch(function(error) {
          console.log(error);
        });

      }


      setTimeout(function() {

        document
          .getElementById("systemQty")
          .focus();

      }, 300);
    }


    function onScanFailure(error) {
      // Ignore normal scanning failures
    }


    // Start scanner
    startScanner();


    // ================================
    // SAVE DATA
    // ================================

    async function saveData() {

      const lpn =
        document.getElementById("lpn").value.trim();

      const systemQty =
        document.getElementById("systemQty").value;

      const physicalQty =
        document.getElementById("physicalQty").value;


      if (!lpn) {

        showError(
          "Please scan an LPN."
        );

        return;
      }


      if (systemQty === "") {

        showError(
          "Please enter System Quantity."
        );

        document
          .getElementById("systemQty")
          .focus();

        return;
      }


      if (physicalQty === "") {

        showError(
          "Please enter Physical Quantity."
        );

        document
          .getElementById("physicalQty")
          .focus();

        return;
      }


      // Disable SAVE to prevent double submission

      document
        .getElementById("saveButton")
        .disabled = true;


      document
        .getElementById("message")
        .innerText = "Saving...";


      document
        .getElementById("message")
        .className = "";


      // ================================
      // BUILD REQUEST
      // ================================

      const url =
        scriptURL +
        "?action=save" +
        "&lpn=" +
        encodeURIComponent(lpn) +
        "&systemQty=" +
        encodeURIComponent(systemQty) +
        "&physicalQty=" +
        encodeURIComponent(physicalQty);


      try {

        /*
         * no-cors is intentional.
         *
         * The browser sends the request to Apps Script,
         * but does not try to read or display Google's
         * response.
         */

        await fetch(
          url,
          {
            method: "GET",
            mode: "no-cors"
          }
        );


        // Give Apps Script a moment to write the row

        await new Promise(function(resolve) {

          setTimeout(resolve, 1200);

        });


        document
          .getElementById("message")
          .innerText =
          "✅ Saved! Ready for next LPN.";

        document
          .getElementById("message")
          .className = "success";


        // Clear everything

        document
          .getElementById("lpn")
          .value = "";

        document
          .getElementById("systemQty")
          .value = "";

        document
          .getElementById("physicalQty")
          .value = "";


        scannedLPN = "";


        // Reset button

        document
          .getElementById("saveButton")
          .disabled = true;


        // Restart scanner

        document
          .getElementById("reader")
          .innerHTML = "";

        startScanner();


      } catch (error) {

        console.error(error);

        showError(
          "Could not send the LPN. Please try again."
        );

        document
          .getElementById("saveButton")
          .disabled = false;
      }
    }


    // ================================
    // ERROR MESSAGE
    // ================================

    function showError(message) {

      document
        .getElementById("message")
        .innerText = message;

      document
        .getElementById("message")
        .className = "error";
    }

  </script>

</body>
</html>
