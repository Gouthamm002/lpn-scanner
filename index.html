<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      max-width: 500px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    #message {
      margin: 15px;
      color: #555;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Scanner</h2>

  <div id="reader"></div>

  <div id="result">
    Scan an LPN QR code
  </div>

  <div id="message">
    Camera will start when the page loads.
  </div>

  <script>
    function onScanSuccess(decodedText) {

      document.getElementById("result").innerText = decodedText;

      document.getElementById("message").innerText =
        "LPN detected!";

      // We will connect this to Google Sheets later.
      console.log("LPN:", decodedText);
    }

    function onScanFailure(error) {
      // Keep scanning
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);
  </script>

</body>
</html>
