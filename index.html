<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      max-width: 500px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    #message {
      margin: 15px;
      color: #555;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Scanner</h2>

  <div id="reader"></div>

  <div id="result">
    Scan an LPN QR code
  </div>

  <div id="message">
    Camera will start when the page loads.
  </div>

  <script>

    // Prevent the same QR code from being saved repeatedly
    let lastScanned = "";

    function onScanSuccess(decodedText) {

      // Ignore repeated scans of the same LPN
      if (decodedText === lastScanned) {
        return;
      }

      lastScanned = decodedText;

      // Show scanned LPN
      document.getElementById("result").innerText = decodedText;

      document.getElementById("message").innerText =
        "LPN detected! Saving...";

      // Your Zepto Apps Script Web App
      const scriptURL =
        "https://script.google.com/a/macros/zepto.com/s/AKfycbw-3Ji-pL5o0klWYeaSk1C1raQWlS8q-UtM1KYxRtVf4RIW-9K9qqNMv_gKsAjYXSRW/exec";

      // Send LPN to Apps Script
      const request = new Image();

      request.onload = function() {

        document.getElementById("message").innerText =
          "✅ LPN saved to Google Sheet!";

      };

      request.onerror = function() {

        document.getElementById("message").innerText =
          "⚠️ LPN detected, but could not confirm saving.";

      };

      request.src =
        scriptURL + "?lpn=" + encodeURIComponent(decodedText);

      console.log("LPN:", decodedText);
    }


    function onScanFailure(error) {
      // Keep scanning
    }


    // Start QR scanner
    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);

  </script>

</body>
</html>
