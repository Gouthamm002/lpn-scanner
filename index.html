<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Audit</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #lpn {
      background: #eeeeee;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #message {
      margin: 15px auto;
      max-width: 500px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .info {
      color: #555;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Audit</h2>

  <div id="reader"></div>

  <div class="box">

    <label for="lpn">LPN</label>

    <input
      type="text"
      id="lpn"
      placeholder="Scan QR code"
      readonly
    >

    <label for="systemQty">System Quantity</label>

    <input
      type="number"
      id="systemQty"
      placeholder="Enter system quantity"
      min="0"
      step="1"
      inputmode="numeric"
    >

    <label for="physicalQty">Physical Quantity</label>

    <input
      type="number"
      id="physicalQty"
      placeholder="Enter physical quantity"
      min="0"
      step="1"
      inputmode="numeric"
    >

    <button
      id="saveButton"
      type="button"
      onclick="saveData()"
      disabled
    >
      SAVE
    </button>

  </div>

  <div id="message" class="info">
    Scan an LPN QR code to begin.
  </div>


  <script>

    // ==================================================
    // GOOGLE APPS SCRIPT BACKEND
    // ==================================================

    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyQymQIwRzS01s264FD5AKOQOVmAAwWSb-ER9nhiJUi0YtVzMfAmwGBnYTPjKtw_LH8XQ/exec";


    // ==================================================
    // GLOBAL VARIABLES
    // ==================================================

    let scanner = null;
    let scannedLPN = "";
    let scanLocked = false;


    // ==================================================
    // MESSAGE HELPER
    // ==================================================

    function setMessage(text, type) {

      const message =
        document.getElementById("message");

      message.innerText = text;

      message.className = type || "info";
    }


    // ==================================================
    // START QR SCANNER
    // ==================================================

    function startScanner() {

      scanLocked = false;

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );

      scanner.render(
        onScanSuccess,
        onScanFailure
      );
    }


    // ==================================================
    // QR SCAN SUCCESS
    // ==================================================

    function onScanSuccess(decodedText) {

      // Prevent repeated scans
      if (scanLocked) {
        return;
      }

      scanLocked = true;

      scannedLPN = decodedText;

      // Put LPN into field
      document.getElementById("lpn").value =
        decodedText;

      // Enable save
      document.getElementById("saveButton").disabled =
        false;

      setMessage(
        "LPN captured. Enter quantities.",
        "info"
      );


      // Stop scanner
      if (scanner) {

        scanner.clear()
          .catch(function(error) {
            console.log(
              "Scanner clear error:",
              error
            );
          });

      }


      // Focus System Quantity
      setTimeout(function() {

        document
          .getElementById("systemQty")
          .focus();

      }, 300);
    }


    // ==================================================
    // QR SCAN FAILURE
    // ==================================================

    function onScanFailure(error) {
      // Normal scanning failures are ignored.
    }


    // ==================================================
    // SAVE AUDIT
    // ==================================================

    function saveData() {

      const lpn =
        document
          .getElementById("lpn")
          .value
          .trim();

      const systemQty =
        document
          .getElementById("systemQty")
          .value
          .trim();

      const physicalQty =
        document
          .getElementById("physicalQty")
          .value
          .trim();


      // ------------------------------------------
      // VALIDATION
      // ------------------------------------------

      if (!lpn) {

        setMessage(
          "Please scan an LPN.",
          "error"
        );

        return;
      }


      if (systemQty === "") {

        setMessage(
          "Please enter System Quantity.",
          "error"
        );

        document
          .getElementById("systemQty")
          .focus();

        return;
      }


      if (physicalQty === "") {

        setMessage(
          "Please enter Physical Quantity.",
          "error"
        );

        document
          .getElementById("physicalQty")
          .focus();

        return;
      }


      // ------------------------------------------
      // PREVENT DOUBLE CLICK
      // ------------------------------------------

      const saveButton =
        document.getElementById("saveButton");

      saveButton.disabled = true;

      setMessage(
        "Saving...",
        "info"
      );


      // ------------------------------------------
      // CREATE UNIQUE JSONP CALLBACK
      // ------------------------------------------

      const callbackName =
        "lpnAuditCallback_" +
        Date.now();


      // ------------------------------------------
      // CALLBACK FUNCTION
      // ------------------------------------------

      window[callbackName] =
        function(response) {

          console.log(
            "Apps Script response:",
            response
          );


          if (
            response &&
            response.success === true
          ) {

            setMessage(
              "✅ Saved! Ready for next LPN.",
              "success"
            );


            // Clear fields
            document
              .getElementById("lpn")
              .value = "";

            document
              .getElementById("systemQty")
              .value = "";

            document
              .getElementById("physicalQty")
              .value = "";


            scannedLPN = "";


            // Remove JSONP request
            if (jsonpScript) {

              jsonpScript.remove();

              jsonpScript = null;
            }


            // Remove callback
            delete window[callbackName];


            // Restart scanner
            setTimeout(function() {

              document
                .getElementById("reader")
                .innerHTML = "";

              saveButton.disabled = true;

              startScanner();

            }, 300);


          } else {

            setMessage(
              "Google Sheet rejected the save.",
              "error"
            );

            saveButton.disabled = false;

            delete window[callbackName];

            if (jsonpScript) {

              jsonpScript.remove();

              jsonpScript = null;
            }
          }
        };


      // ------------------------------------------
      // BUILD REQUEST URL
      // ------------------------------------------

      const requestURL =
        scriptURL +
        "?action=save" +
        "&lpn=" +
        encodeURIComponent(lpn) +
        "&systemQty=" +
        encodeURIComponent(systemQty) +
        "&physicalQty=" +
        encodeURIComponent(physicalQty) +
        "&callback=" +
        encodeURIComponent(callbackName);


      console.log(
        "Sending to Apps Script:",
        requestURL
      );


      // ------------------------------------------
      // JSONP SCRIPT REQUEST
      // ------------------------------------------

      var jsonpScript =
        document.createElement("script");

      jsonpScript.src = requestURL;

      jsonpScript.async = true;


      // ------------------------------------------
      // REQUEST ERROR
      // ------------------------------------------

      jsonpScript.onerror =
        function() {

          console.error(
            "JSONP request failed."
          );

          setMessage(
            "❌ Could not connect to Google Sheet.",
            "error"
          );

          saveButton.disabled = false;

          delete window[callbackName];

          if (jsonpScript) {

            jsonpScript.remove();

            jsonpScript = null;
          }
        };


      // ------------------------------------------
      // SEND REQUEST
      // ------------------------------------------

      document
        .body
        .appendChild(jsonpScript);
    }


    // ==================================================
    // START APPLICATION
    // ==================================================

    startScanner();

  </script>

</body>
</html>
