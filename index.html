<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Audit</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #lpn {
      background: #eeeeee;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
      margin-top: 5px;
    }

    button:disabled {
      background: #aaa;
    }

    .cancel {
      background: #777;
    }

    .audit-again {
      background: #b45309;
    }

    #message {
      margin: 15px auto;
      max-width: 500px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .info {
      color: #555;
    }

    #duplicateBox {
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 12px;
      box-sizing: border-box;
      text-align: left;
    }

    #duplicateBox h3 {
      text-align: center;
      margin-top: 0;
    }

    .previous {
      background: white;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.8;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<h2>📦 LPN Audit</h2>

<div id="reader"></div>

<div id="duplicateBox" class="hidden">

  <h3>⚠️ DUPLICATE LPN</h3>

  <p>
    This LPN has already been audited.
  </p>

  <div class="previous">
    <b>Previous Audit</b><br>

    System Qty:
    <span id="previousSystem">-</span><br>

    Physical Qty:
    <span id="previousPhysical">-</span><br>

    Difference:
    <span id="previousDifference">-</span><br>

    Status:
    <b id="previousStatus">-</b>
  </div>

  <button
    class="audit-again"
    onclick="auditAgain()"
  >
    AUDIT AGAIN
  </button>

  <button
    class="cancel"
    onclick="cancelDuplicate()"
  >
    CANCEL
  </button>

</div>


<div id="auditBox" class="box">

  <label>LPN</label>

  <input
    type="text"
    id="lpn"
    placeholder="Scan QR code"
    readonly
  >

  <label>System Quantity</label>

  <input
    type="number"
    id="systemQty"
    placeholder="Enter system quantity"
    min="0"
    step="1"
    inputmode="numeric"
  >

  <label>Physical Quantity</label>

  <input
    type="number"
    id="physicalQty"
    placeholder="Enter physical quantity"
    min="0"
    step="1"
    inputmode="numeric"
  >

  <button
    id="saveButton"
    onclick="saveData()"
    disabled
  >
    SAVE
  </button>

</div>


<div id="message" class="info">
  Scan an LPN QR code to begin.
</div>


<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbyQymQIwRzS01s264FD5AKOQOVmAAwWSb-ER9nhiJUi0YtVzMfAmwGBnYTPjKtw_LH8XQ/exec";

let scanner = null;
let scannedLPN = "";
let scanLocked = false;


/* ==========================================
   MESSAGE
========================================== */

function message(text, type = "info") {

  const el =
    document.getElementById("message");

  el.innerText = text;
  el.className = type;
}


/* ==========================================
   START SCANNER
========================================== */

function startScanner() {

  scanLocked = false;

  scanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

  scanner.render(
    onScanSuccess,
    function(error) {}
  );
}


/* ==========================================
   QR SCANNED
========================================== */

function onScanSuccess(decodedText) {

  if (scanLocked) {
    return;
  }

  scanLocked = true;

  scannedLPN = decodedText;

  document.getElementById("lpn").value =
    decodedText;

  message(
    "Checking LPN...",
    "info"
  );

  if (scanner) {

    scanner.clear().catch(
      function(error) {
        console.log(error);
      }
    );

  }

  checkDuplicate(decodedText);
}


/* ==========================================
   JSONP REQUEST
========================================== */

function jsonp(url, callback) {

  const callbackName =
    "jsonp_" + Date.now();

  window[callbackName] =
    function(data) {

      // Give browser time to finish
      // executing the JSONP callback.
      setTimeout(function() {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }, 100);

      callback(data);
    };


  const script =
    document.createElement("script");

  script.src =
    url +
    "&callback=" +
    encodeURIComponent(callbackName);

  script.async = true;


  script.onerror =
    function() {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      callback(null);
    };


  document.body.appendChild(script);
}


/* ==========================================
   DUPLICATE CHECK
========================================== */

function checkDuplicate(lpn) {

  const url =
    scriptURL +
    "?action=check" +
    "&lpn=" +
    encodeURIComponent(lpn);


  jsonp(
    url,
    function(response) {

      if (!response) {

        message(
          "❌ Could not connect to Google Sheet.",
          "error"
        );

        resetApp();
        return;
      }


      if (response.success !== true) {

        message(
          "❌ Google Sheet returned an error.",
          "error"
        );

        resetApp();
        return;
      }


      if (response.duplicate === true) {

        document.getElementById(
          "previousSystem"
        ).innerText =
          response.previous.systemQty;

        document.getElementById(
          "previousPhysical"
        ).innerText =
          response.previous.physicalQty;

        document.getElementById(
          "previousDifference"
        ).innerText =
          response.previous.difference;

        document.getElementById(
          "previousStatus"
        ).innerText =
          response.previous.status;


        document.getElementById(
          "duplicateBox"
        ).classList.remove("hidden");

        document.getElementById(
          "auditBox"
        ).classList.add("hidden");


        message(
          "Duplicate LPN detected.",
          "error"
        );

      } else {

        showNewLPN();

      }

    }
  );
}


/* ==========================================
   NEW LPN
========================================== */

function showNewLPN() {

  document.getElementById(
    "duplicateBox"
  ).classList.add("hidden");

  document.getElementById(
    "auditBox"
  ).classList.remove("hidden");

  document.getElementById(
    "saveButton"
  ).disabled = false;


  message(
    "✅ New LPN. Enter quantities.",
    "success"
  );


  setTimeout(function() {

    document
      .getElementById("systemQty")
      .focus();

  }, 300);
}


/* ==========================================
   AUDIT AGAIN
========================================== */

function auditAgain() {

  document.getElementById(
    "duplicateBox"
  ).classList.add("hidden");

  document.getElementById(
    "auditBox"
  ).classList.remove("hidden");

  document.getElementById(
    "saveButton"
  ).disabled = false;


  message(
    "Audit again. Enter new quantities.",
    "info"
  );


  document
    .getElementById("systemQty")
    .focus();
}


/* ==========================================
   CANCEL DUPLICATE
========================================== */

function cancelDuplicate() {

  resetApp();

  message(
    "Scan the next LPN.",
    "info"
  );
}


/* ==========================================
   SAVE
========================================== */

function saveData() {

  const lpn =
    document
      .getElementById("lpn")
      .value
      .trim();

  const systemQty =
    document
      .getElementById("systemQty")
      .value
      .trim();

  const physicalQty =
    document
      .getElementById("physicalQty")
      .value
      .trim();


  if (!lpn) {
    message(
      "Please scan an LPN.",
      "error"
    );
    return;
  }


  if (systemQty === "") {
    message(
      "Please enter System Quantity.",
      "error"
    );
    return;
  }


  if (physicalQty === "") {
    message(
      "Please enter Physical Quantity.",
      "error"
    );
    return;
  }


  document.getElementById(
    "saveButton"
  ).disabled = true;


  message(
    "Saving...",
    "info"
  );


  const url =
    scriptURL +
    "?action=save" +
    "&lpn=" +
    encodeURIComponent(lpn) +
    "&systemQty=" +
    encodeURIComponent(systemQty) +
    "&physicalQty=" +
    encodeURIComponent(physicalQty);


  jsonp(
    url,
    function(response) {

      if (
        response &&
        response.success === true
      ) {

        resetFields();

        message(
          "✅ Saved! Ready for next LPN.",
          "success"
        );


        setTimeout(function() {

          document.getElementById(
            "reader"
          ).innerHTML = "";

          startScanner();

        }, 300);

      } else {

        message(
          "❌ Save failed.",
          "error"
        );

        document.getElementById(
          "saveButton"
        ).disabled = false;
      }

    }
  );
}


/* ==========================================
   RESET FIELDS
========================================== */

function resetFields() {

  document.getElementById(
    "lpn"
  ).value = "";

  document.getElementById(
    "systemQty"
  ).value = "";

  document.getElementById(
    "physicalQty"
  ).value = "";

  document.getElementById(
    "saveButton"
  ).disabled = true;

  scannedLPN = "";
}


/* ==========================================
   RESET APP
========================================== */

function resetApp() {

  resetFields();

  document.getElementById(
    "duplicateBox"
  ).classList.add("hidden");

  document.getElementById(
    "auditBox"
  ).classList.remove("hidden");

  document.getElementById(
    "reader"
  ).innerHTML = "";


  setTimeout(function() {

    startScanner();

  }, 300);
}


/* ==========================================
   START
========================================== */

startScanner();

</script>

</body>
</html>
