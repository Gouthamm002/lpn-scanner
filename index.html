<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Audit</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #lpn {
      background: #eeeeee;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #message {
      margin: 15px auto;
      max-width: 500px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .info {
      color: #555;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Audit</h2>

  <div id="reader"></div>

  <div class="box">

    <label for="lpn">LPN</label>

    <input
      type="text"
      id="lpn"
      placeholder="Scan QR code"
      readonly
    >

    <label for="systemQty">System Quantity</label>

    <input
      type="number"
      id="systemQty"
      placeholder="Enter system quantity"
      min="0"
      step="1"
      inputmode="numeric"
    >

    <label for="physicalQty">Physical Quantity</label>

    <input
      type="number"
      id="physicalQty"
      placeholder="Enter physical quantity"
      min="0"
      step="1"
      inputmode="numeric"
    >

    <button
      id="saveButton"
      type="button"
      onclick="saveData()"
      disabled
    >
      SAVE
    </button>

  </div>

  <div id="message" class="info">
    Scan an LPN QR code to begin.
  </div>

  <script>

    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyQymQIwRzS01s264FD5AKOQOVmAAwWSb-ER9nhiJUi0YtVzMfAmwGBnYTPjKtw_LH8XQ/exec";

    let scanner = null;
    let scannedLPN = "";
    let scanLocked = false;

    function setMessage(text, type) {

      const message =
        document.getElementById("message");

      message.innerText = text;
      message.className = type || "info";
    }

    function startScanner() {

      scanLocked = false;

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );

      scanner.render(
        onScanSuccess,
        onScanFailure
      );
    }

    function onScanSuccess(decodedText) {

      if (scanLocked) {
        return;
      }

      scanLocked = true;

      scannedLPN = decodedText;

      document.getElementById("lpn").value =
        decodedText;

      document.getElementById("saveButton").disabled =
        false;

      setMessage(
        "LPN captured. Enter quantities.",
        "info"
      );

      if (scanner) {

        scanner.clear().catch(
          function(error) {
            console.log(error);
          }
        );
      }

      setTimeout(function() {

        document
          .getElementById("systemQty")
          .focus();

      }, 300);
    }

    function onScanFailure(error) {}

    function saveData() {

      const lpn =
        document
          .getElementById("lpn")
          .value
          .trim();

      const systemQty =
        document
          .getElementById("systemQty")
          .value
          .trim();

      const physicalQty =
        document
          .getElementById("physicalQty")
          .value
          .trim();

      if (!lpn) {

        setMessage(
          "Please scan an LPN.",
          "error"
        );

        return;
      }

      if (systemQty === "") {

        setMessage(
          "Please enter System Quantity.",
          "error"
        );

        return;
      }

      if (physicalQty === "") {

        setMessage(
          "Please enter Physical Quantity.",
          "error"
        );

        return;
      }

      document.getElementById(
        "saveButton"
      ).disabled = true;

      setMessage(
        "Saving...",
        "info"
      );

      const callbackName =
        "lpnSaved_" + Date.now();

      window[callbackName] =
        function(response) {

          if (
            response &&
            response.success === true
          ) {

            document.getElementById(
              "message"
            ).innerText =
              "✅ Saved! Ready for next LPN.";

            document.getElementById(
              "message"
            ).className =
              "success";

            document.getElementById(
              "lpn"
            ).value = "";

            document.getElementById(
              "systemQty"
            ).value = "";

            document.getElementById(
              "physicalQty"
            ).value = "";

            scannedLPN = "";

            document.getElementById(
              "saveButton"
            ).disabled = true;

            if (script) {
              script.remove();
            }

            delete window[callbackName];

            setTimeout(function() {

              document.getElementById(
                "reader"
              ).innerHTML = "";

              startScanner();

            }, 300);

          } else {

            setMessage(
              "Save failed. Please try again.",
              "error"
            );

            document.getElementById(
              "saveButton"
            ).disabled = false;
          }
        };

      const url =
        scriptURL +
        "?action=save" +
        "&lpn=" +
        encodeURIComponent(lpn) +
        "&systemQty=" +
        encodeURIComponent(systemQty) +
        "&physicalQty=" +
        encodeURIComponent(physicalQty) +
        "&callback=" +
        encodeURIComponent(callbackName);

      const script =
        document.createElement("script");

      script.src = url;
      script.async = true;

      script.onerror = function() {

        setMessage(
          "Could not connect to Google Sheet.",
          "error"
        );

        document.getElementById(
          "saveButton"
        ).disabled = false;

        delete window[callbackName];

        script.remove();
      };

      document.body.appendChild(script);
    }

    startScanner();

  </script>

</body>
</html>
