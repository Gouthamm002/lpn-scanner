<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPN Audit</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .box {
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #lpn {
      background: #eeeeee;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }

    #message {
      margin: 15px auto;
      max-width: 500px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    #sender {
      display: none;
    }
  </style>
</head>

<body>

  <h2>📦 LPN Audit</h2>

  <div id="reader"></div>

  <div class="box">

    <label>LPN</label>

    <input
      type="text"
      id="lpn"
      placeholder="Scan QR code"
      readonly
    >

    <label>System Quantity</label>

    <input
      type="number"
      id="systemQty"
      placeholder="Enter system quantity"
      min="0"
      inputmode="numeric"
    >

    <label>Physical Quantity</label>

    <input
      type="number"
      id="physicalQty"
      placeholder="Enter physical quantity"
      min="0"
      inputmode="numeric"
    >

    <button
      id="saveButton"
      onclick="saveData()"
      disabled
    >
      SAVE
    </button>

  </div>

  <div id="message">
    Scan an LPN QR code to begin.
  </div>

  <!-- Hidden destination for Apps Script -->
  <iframe
    id="sender"
    name="sender"
  ></iframe>


  <script>

    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyQymQIwRzS01s264FD5AKOQOVmAAwWSb-ER9nhiJUi0YtVzMfAmwGBnYTPjKtw_LH8XQ/exec";


    let scannedLPN = "";
    let scanner = null;
    let scanLocked = false;


    // -------------------------------
    // START SCANNER
    // -------------------------------

    function startScanner() {

      scanLocked = false;

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );

      scanner.render(
        onScanSuccess,
        onScanFailure
      );
    }


    // -------------------------------
    // QR SCANNED
    // -------------------------------

    function onScanSuccess(decodedText) {

      if (scanLocked) {
        return;
      }

      scanLocked = true;

      scannedLPN = decodedText;

      document.getElementById("lpn").value = decodedText;

      document.getElementById("message").innerText =
        "LPN captured. Enter quantities.";

      document.getElementById("message").className = "";

      document.getElementById("saveButton").disabled = false;

      // Stop scanner while entering quantities
      if (scanner) {
        scanner.clear().catch(function(error) {
          console.log(error);
        });
      }

      // Automatically focus System Quantity
      setTimeout(function() {
        document.getElementById("systemQty").focus();
      }, 300);
    }


    function onScanFailure(error) {
      // Normal QR scanning failures are ignored
    }


    // Start scanner when page loads
    startScanner();


    // -------------------------------
    // SAVE
    // -------------------------------

    function saveData() {

      const lpn =
        document.getElementById("lpn").value.trim();

      const systemQty =
        document.getElementById("systemQty").value;

      const physicalQty =
        document.getElementById("physicalQty").value;


      if (!lpn) {
        showError("Please scan an LPN.");
        return;
      }


      if (systemQty === "") {
        showError("Please enter System Quantity.");
        document.getElementById("systemQty").focus();
        return;
      }


      if (physicalQty === "") {
        showError("Please enter Physical Quantity.");
        document.getElementById("physicalQty").focus();
        return;
      }


      // Disable button to prevent duplicate submissions
      document.getElementById("saveButton").disabled = true;

      document.getElementById("message").innerText =
        "Saving...";

      document.getElementById("message").className = "";


      // --------------------------------
      // Create hidden form
      // --------------------------------

      const form = document.createElement("form");

      form.method = "GET";

      form.action = scriptURL;

      form.target = "sender";


      // action=save
      addField(form, "action", "save");

      // LPN
      addField(form, "lpn", lpn);

      // System Quantity
      addField(form, "systemQty", systemQty);

      // Physical Quantity
      addField(form, "physicalQty", physicalQty);


      document.body.appendChild(form);

      form.submit();


      // Remove temporary form
      setTimeout(function() {
        form.remove();
      }, 1000);


      // --------------------------------
      // Reset app
      // --------------------------------

      setTimeout(function() {

        document.getElementById("message").innerText =
          "✅ Saved! Ready for next LPN.";

        document.getElementById("message").className =
          "success";


        document.getElementById("lpn").value = "";

        document.getElementById("systemQty").value = "";

        document.getElementById("physicalQty").value = "";


        scannedLPN = "";

        document.getElementById("saveButton").disabled = true;


        // Start scanner again
        document.getElementById("reader").innerHTML = "";

        startScanner();

      }, 1200);
    }


    // -------------------------------
    // FORM FIELD HELPER
    // -------------------------------

    function addField(form, name, value) {

      const input = document.createElement("input");

      input.type = "hidden";

      input.name = name;

      input.value = value;

      form.appendChild(input);
    }


    // -------------------------------
    // MESSAGES
    // -------------------------------

    function showError(message) {

      document.getElementById("message").innerText =
        message;

      document.getElementById("message").className =
        "error";
    }

  </script>

</body>
</html>
